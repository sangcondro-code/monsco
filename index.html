<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Monsco: Money Management</title>

<!-- Ikon di dokumen top-level ini supaya iPhone membacanya saat Add to Home Screen -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" type="image/png" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Monsco">
<meta name="theme-color" content="#005CAA">
<!-- Dibuka dari Home Screen seperti app sungguhan (tanpa address bar Safari) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://script.google.com" crossorigin>

<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }

  #splash { position:fixed; inset:0; z-index:10; background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0; transition:opacity .3s; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { display:block; width:60px; height:60px; border-radius:16px; object-fit:cover; animation:pulse 1.4s ease-in-out infinite; }
  #slow { display:none; margin-top:22px; text-align:center; font-size:.85rem; color:#4b5563; line-height:1.5; padding:0 28px; }
  .btn { display:inline-block; margin:8px 6px 0; padding:9px 16px; border-radius:10px; border:1px solid #005CAA;
    background:#fff; color:#005CAA; font-weight:600; font-size:.85rem; font-family:inherit; text-decoration:none; cursor:pointer; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.9);opacity:.72} }
  @media (prefers-reduced-motion:reduce){ #splash img { animation:none } }
</style>
</head>
<body>

<iframe id="app" title="Monsco" allow="clipboard-write; fullscreen"></iframe>

<div id="splash">
  <img src="loading_monsco.jpg" alt="Monsco">
  <div id="slow">
    Loading is taking longer than usual.<br>
    <button class="btn" onclick="location.reload()">Reload</button>
    <a class="btn" id="direct" target="_top">Open directly</a>
  </div>
</div>

<script>
(function () {
  // URL Web App GAS (deployment /exec). Ganti di sini kalau redeploy ke URL baru.
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbw_5SZH1TsqEJ8LVVTsAe1LnO3xnKCpi7S-XLe__zI-aTI120HzqsvypNCoAzqlUWR2/exec';

  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('direct').href = GAS_URL;

  var slow = setTimeout(function () {
    document.getElementById('slow').style.display = 'block';
  }, 15000);
  frame.addEventListener('load', function () { clearTimeout(slow); splash.classList.add('hide'); });
  frame.src = GAS_URL;

  /* ===== Penitipan sesi login (jembatan dari app GAS di dalam iframe) =====
     Sesi disimpan di sini (first-party, lebih awet di iPhone) dan hangus kalau
     SESSION_TTL_MS tidak dipakai. Hanya menerima pesan dari googleusercontent.com / google.com. */
  var SESSION_KEY = 'monsco_bridge_v1';
  var SESSION_TTL_MS = 3 * 24 * 60 * 60 * 1000; // 3 hari
  var ORIGIN_OK = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/;
  function bLoad() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
  function bSave(o) { try { if (o) localStorage.setItem(SESSION_KEY, JSON.stringify(o)); else localStorage.removeItem(SESSION_KEY); } catch (e) {} }
  // Diagnosa: buka halaman ini dengan tambahan ?debug di alamatnya untuk melihat log pesan.
  var DEBUG = /[?&]debug\b/.test(location.search), dbg = null, dbgLines = [];
  function blog(t) {
    if (!DEBUG) return;
    if (!dbg) {
      dbg = document.createElement('div');
      dbg.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:rgba(0,0,0,.8);color:#7CFC00;font:11px/1.4 monospace;padding:6px 8px;pointer-events:none;white-space:pre-wrap;word-break:break-all';
      document.body.appendChild(dbg);
    }
    dbgLines.push(new Date().toLocaleTimeString() + ' ' + t);
    if (dbgLines.length > 8) dbgLines.shift();
    dbg.textContent = dbgLines.join('\n');
  }
  (function () { var c = bLoad(); blog('page: ' + location.origin + ' | stored session: ' + (c ? 'yes, ' + Math.round((Date.now() - c.last) / 60000) + ' min ago' : 'no')); })();

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.monsco !== 1) return;
    if (!ORIGIN_OK.test(e.origin)) { blog('REJECTED origin ' + e.origin); return; }
    blog('recv ' + d.type);
    var now = Date.now(), cur = bLoad();
    if (d.type === 'save' && typeof d.payload === 'string') bSave({ payload: d.payload, last: now });
    else if (d.type === 'touch') { if (cur) { cur.last = now; bSave(cur); } }
    else if (d.type === 'clear') bSave(null);
    else if (d.type === 'get') {
      var ok = cur && (now - cur.last) < SESSION_TTL_MS;
      if (cur && !ok) bSave(null);
      blog('reply session: ' + (ok ? 'yes' : 'no'));
      try { e.source.postMessage({ monsco: 1, type: 'session', payload: ok ? cur.payload : null }, e.origin); } catch (err) {}
    }
  });

  // Bersihkan Service Worker lama (sw.js) di perangkat yang pernah membuka versi sebelumnya
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('monsco-static') === 0) caches.delete(k); }); });
  } catch (e) {}
})();
</script>
</body>
</html>
